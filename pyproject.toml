[project]
name = "qqmusicmcp"
version = "0.1.0"
description = "Unified official QQ Music + personal-library MCP server"
requires-python = ">=3.11"
dependencies = ["mcp>=1.12,<2","httpx>=0.28,<1"]
[project.optional-dependencies]
test = ["pytest>=8,<9","pytest-asyncio>=0.24,<2"]
[project.scripts]
qqmusicmcp = "qqmusicmcp.server:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/qqmusicmcp"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

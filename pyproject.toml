[project]
name = "qqmusicmcp"
version = "0.1.0a1"
description = "Experimental unofficial QQ Music MCP server"
license = { text = "MIT" }
classifiers = ["Development Status :: 3 - Alpha", "License :: OSI Approved :: MIT License", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3"]
requires-python = ">=3.11"
dependencies = ["mcp>=1.12,<2","httpx>=0.28,<1"]
[project.optional-dependencies]
test = ["pytest>=8,<9","pytest-asyncio>=0.24,<2"]
[project.scripts]
qqmusicmcp = "qqmusicmcp.server:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/qqmusicmcp"]

[tool.hatch.build.targets.wheel.force-include]
"licenses/baoozak-MIT.txt" = "qqmusicmcp/licenses/baoozak-MIT.txt"
"THIRD_PARTY_NOTICES.md" = "qqmusicmcp/THIRD_PARTY_NOTICES.md"
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
